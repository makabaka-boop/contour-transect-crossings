services:
  web:
    build: .
    container_name: contour-workbench-web
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev -- --host 0.0.0.0

  test:
    build: .
    profiles: ["test"]
    volumes:
      - .:/app
      - /app/node_modules
    command: npm test
